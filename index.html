<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b12">
<meta name="description" content="Nexus Launcher — thư viện trò chơi Việt hóa, kích hoạt và các dịch vụ tích hợp.">
<title>Nexus Launcher</title>

<link rel="icon" href="./Logo_NexusT.png" type="image/png">

<!-- Mo ket noi som toi cac may chu se dung ngay -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://shared.akamai.steamstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.akamai.steamstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://video.akamai.steamstatic.com">

<!-- Man hinh khoi dong: to mau ngay lap tuc, khong doi CSS ngoai -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #070b12; }
  #nx-boot {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #070b12;
    font-family: 'Outfit', system-ui, sans-serif;
    transition: opacity 420ms cubic-bezier(.22,1,.36,1), visibility 0s linear 420ms;
  }
  #nx-boot.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #nx-boot .boot__logo {
    width: 62px; height: 62px; border-radius: 18px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #3ad8ff, #5aa8ff 55%, #8b6cff);
    color: #04131a; font-size: 30px;
    box-shadow: 0 12px 40px rgba(58, 216, 255, 0.28);
    animation: nxb-pulse 1.9s ease-in-out infinite;
  }
  #nx-boot .boot__t {
    font-size: 15px; font-weight: 800; letter-spacing: 0.3em; color: #8fa0b8;
  }
  #nx-boot .boot__trk {
    width: 190px; height: 3px; border-radius: 99px;
    background: rgba(255,255,255,0.07); overflow: hidden;
  }
  #nx-boot .boot__bar {
    height: 100%; width: 40%; border-radius: inherit;
    background: linear-gradient(135deg, #3ad8ff, #5aa8ff 55%, #8b6cff);
    animation: nxb-run 1.15s ease-in-out infinite;
  }
  @keyframes nxb-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes nxb-run { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  @media (prefers-reduced-motion: reduce) {
    #nx-boot .boot__logo, #nx-boot .boot__bar { animation: none; }
  }
</style>

<!-- Font chu: Outfit (tieu de) · Be Vietnam Pro (giao dien) · Inter (con so) -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap">

<!-- Bo icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/fill/style.css">

<!-- Giao dien Nexus -->
<link rel="stylesheet" href="./css/tokens.css?v=6">
<link rel="stylesheet" href="./css/base.css?v=6">
<link rel="stylesheet" href="./css/components.css?v=6">
<link rel="stylesheet" href="./css/views.css?v=6">
</head>

<body>

<div id="nx-boot">
  <div class="boot__logo"><i class="ph-fill ph-lightning"></i></div>
  <div class="boot__t">NEXUS LAUNCHER</div>
  <div class="boot__trk"><div class="boot__bar"></div></div>
</div>

<div id="root"></div>

<noscript>
  <div style="padding:40px;text-align:center;color:#e6edf7;font-family:system-ui,sans-serif">
    Nexus Launcher cần JavaScript để chạy. Vui lòng bật JavaScript rồi tải lại.
  </div>
</noscript>

<!-- ==========================================================================
     1. DU LIEU — JavaScript thuan, KHONG di qua Babel (nhanh hon rat nhieu)
     ========================================================================== -->
<script src="./js/data.games.js?v=6"></script>
<script src="./js/data.media.js?v=6"></script>
<script src="./js/data.static.js?v=6"></script>
<script src="./js/i18n.js?v=6"></script>

<!-- ==========================================================================
     2. THU VIEN
     ========================================================================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js" crossorigin></script>

<!-- ==========================================================================
     3. GIAO DIEN — chay theo dung thu tu: core -> cards -> detail -> views
                    -> integrate -> shell
     ========================================================================== -->
<script type="text/babel" data-presets="react" src="./js/app.core.jsx?v=6"></script>
<script type="text/babel" data-presets="react" src="./js/app.cards.jsx?v=6"></script>
<script type="text/babel" data-presets="react" src="./js/app.detail.jsx?v=6"></script>
<script type="text/babel" data-presets="react" src="./js/app.views.jsx?v=6"></script>
<script type="text/babel" data-presets="react" src="./js/app.integrate.jsx?v=6"></script>
<script type="text/babel" data-presets="react" src="./js/app.shell.jsx?v=6"></script>

<!-- ==========================================================================
     4. LUOI AN TOAN — neu co gi do hong, bao cho nguoi dung thay vi man hinh den
     ========================================================================== -->
<script>
(function () {
  'use strict';

  function fail(detail) {
    var boot = document.getElementById('nx-boot');
    if (!boot || boot.dataset.failed) return;
    boot.dataset.failed = '1';
    boot.innerHTML =
      '<div class="boot__logo" style="background:linear-gradient(135deg,#ff4f6d,#ff9445);animation:none">' +
        '<i class="ph-fill ph-warning"></i></div>' +
      '<div class="boot__t" style="letter-spacing:.12em">KHÔNG TẢI ĐƯỢC GIAO DIỆN</div>' +
      '<div style="max-width:460px;text-align:center;font-size:13px;line-height:1.7;color:#8fa0b8;' +
           'font-family:system-ui,sans-serif">' +
        'Hãy kiểm tra kết nối mạng rồi mở lại Nexus Launcher. ' +
        'Nếu vẫn lỗi, vào Discord để được hỗ trợ.' +
        '<div style="margin-top:14px;font-size:11px;color:#5c6a80;word-break:break-word">' +
          (detail || '') + '</div>' +
      '</div>';
  }

  /* Chi bat loi script that su — bo qua anh/video tai hong (rat hay xay ra
     voi CDN cua Steam va khong lam hong giao dien). */
  window.addEventListener('error', function (e) {
    if (!e || e.target !== window) return;
    if (document.getElementById('root').childElementCount === 0) {
      fail(e.message ? String(e.message).slice(0, 220) : '');
    }
  });

  setTimeout(function () {
    if (document.getElementById('root').childElementCount === 0) {
      fail('Hết thời gian chờ (20 giây).');
    }
  }, 20000);
})();
</script>

</body>
</html>
